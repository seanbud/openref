[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beeref*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.png", "*.ico", "*.icns"]

[project]
name = "OpenRef"
version = "0.4.0-dev"
description = "A free, modern, canvas-first reference board"
readme = "README.rst"
license = {file = "LICENSE"}
authors = [
    { name = "Rebecca Breu", email = "rebecca@rbreu.de" },
]
maintainers = [
    { name = "Sean Budning" },
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "exif>=1.3.5,<=1.6.0",
    "lxml==5.1.0",
    "pyQt6-Qt6>=6.7.0,<=6.7.0",
    "pyQt6>=6.7.0,<=6.7.0",
    "rectangle-packer>=2.0.1,<=2.0.2",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.gui-scripts]
openref = "beeref.__main__:main"
beeref = "beeref.__main__:main"

[project.urls]
Homepage = "https://github.com/seanbud/openref"
Repository = "https://github.com/seanbud/openref"
Issues = "https://github.com/seanbud/openref/issues"
Changelog = "https://github.com/seanbud/openref/blob/main/CHANGELOG.rst"
